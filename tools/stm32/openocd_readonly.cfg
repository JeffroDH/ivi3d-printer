# Read-only SWD capture for the IVI motion controller.
# OpenOCD 0.11 or newer (`adapter driver`, `transport select dapdirect_swd`).
#
# The 2026-11-10 dump used this pattern and nothing else: an ST-Link V2 clone
# on the board's SWD pads, OpenOCD's mem_ap target, no reset, no halt, and no
# cortex_m examine. That examine writes DHCSR, DEMCR and the FPB, so this file
# never creates a cortex_m target.
#
# Reads only. No erase, no program, no option-byte write. Run it only when
# that read is authorized:
#
#   openocd -f tools/stm32/openocd_readonly.cfg
#
# Images land in the current directory unless STM32_DUMP_DIR is set.
# The 2026-11-10 copies, and their MD5s, are in firmware/stm32_dump/.
# Two independent flash reads that night were identical.
#
# Measured on that session, for comparison with the mdw lines below:
#   DPIDR          0x2BA01477   (the -expected-id on swd newdap)
#   DBGMCU_IDCODE  0x10076413   (STM32F405/407/415/417 family, 512 KB)
#   CPUID          0x410FC241   (Cortex-M4)
#   FLASH_OPTCR    0x0FFFAAED   (RDP 0xAA = level 0, nWRP 0xFFF)

adapter driver st-link
transport select dapdirect_swd
reset_config none

swd newdap ivistm32 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create ivistm32.dap -chain-position ivistm32.cpu
target create ivistm32.mem mem_ap -dap ivistm32.dap -ap-num 0

init

# DBGMCU_IDCODE, CPUID, FLASH_OPTCR.
mdw 0xE0042000 1
mdw 0xE000ED00 1
mdw 0x40023C14 1

set _out "."
if {[info exists ::env(STM32_DUMP_DIR)]} {
    set _out $::env(STM32_DUMP_DIR)
}
dump_image $_out/stm32_flash.bin 0x08000000 0x80000
dump_image $_out/stm32_sysmem.bin 0x1FFF0000 0x7800
dump_image $_out/stm32_otp.bin 0x1FFF7800 0x210
dump_image $_out/stm32_optbytes.bin 0x1FFFC000 0x10

shutdown
